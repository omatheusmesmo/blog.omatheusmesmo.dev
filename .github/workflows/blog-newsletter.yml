name: Blog Newsletter + README Update

on:
  push:
    branches: [main]
    paths: ['content/posts/**']
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Test email (sends only to this address, skips the group)'
        required: false
        type: string
      article_dir:
        description: 'Article directory to send (e.g. 2026-06-20-quarkus-event-bus-consumeevent). Leave empty to auto-detect from git diff.'
        required: false
        type: string

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blog
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Checkout profile
        uses: actions/checkout@v4
        with:
          repository: omatheusmesmo/omatheusmesmo
          path: profile-repo
          token: ${{ secrets.PROFILE_README_TOKEN }}

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - parallel:
          - name: Send newsletter
            run: chmod +x scripts/send-newsletter && scripts/send-newsletter
            env:
              MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
              TEST_EMAIL: ${{ inputs.test_email }}
              ARTICLE_DIR: ${{ inputs.article_dir }}

          - name: Update README
            run: chmod +x scripts/update-readme && scripts/update-readme --blog
            env:
              README_PATH: profile-repo/README.md

      - name: Push README changes
        if: success()
        run: |
          cd profile-repo
          git config user.name "Matheus Oliveira"
          git config user.email "matheus.6148@gmail.com"
          git add README.md
          git diff --cached --quiet || git commit -m "docs: update blog posts list"
          git push

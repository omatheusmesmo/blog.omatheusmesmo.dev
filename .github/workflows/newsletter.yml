name: Send Newsletter

on:
  push:
    branches: [main]
    paths: ['content/posts/**']
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Test email (sends only to this address, skips the group)'
        required: false
        type: string
      article_dir:
        description: 'Article directory to send (e.g. 2026-06-20-quarkus-event-bus-consumeevent). Leave empty to auto-detect from git diff.'
        required: false
        type: string

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Send newsletter
        run: chmod +x scripts/send-newsletter && scripts/send-newsletter
        env:
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
          TEST_EMAIL: ${{ inputs.test_email }}
          ARTICLE_DIR: ${{ inputs.article_dir }}
